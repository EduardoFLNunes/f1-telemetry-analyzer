; Radio do engenheiro (pedido 31, ADR 0020): o radio do coach dentro do jogo.
; Instalado por tools\csp_app\instalar.ps1 em <pasta do jogo>\apps\lua\radio_engenheiro\
; e removido por tools\csp_app\remover.ps1. So le o estado do jogo e conversa com o
; backend local (127.0.0.1:8000); nao muda o carro, os controles nem o jogo.

[ABOUT]
NAME = Rádio do engenheiro
AUTHOR = Sistema de Telemetria e Otimização de Trajetórias
VERSION = 0.1.0
DESCRIPTION = As mensagens do coach no jogo: um cartão e a voz, nas retas e na linha de chegada.

[CORE]
LAZY = NONE

[WINDOW_...]
ID = radio
NAME = Rádio · Sistema de Telemetria e Otimização de Trajetórias
FUNCTION_MAIN = janela
SIZE = 560, 150
FLAGS = NO_TITLE_BAR, NO_BACKGROUND, NO_SCROLLBAR, NO_COLLAPSE
