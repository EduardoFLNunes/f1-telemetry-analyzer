; Radio do engenheiro (pedido 31, ADR 0020; pedido 35, ADR 0021): o radio do coach e o
; minimapa dentro do jogo. Instalado por tools\csp_app\instalar.ps1 em
; <pasta do jogo>\apps\lua\radio_engenheiro\ e removido por tools\csp_app\remover.ps1.
; So le o estado do jogo e conversa com o backend local (127.0.0.1:8000); nao muda o
; carro, os controles nem o jogo. So grava na propria pasta (a subpasta voz).
; Quatro janelas, ligadas e desligadas cada uma na barra de apps do jogo: o radio, o
; minimapa (a pista inteira), o mapa aproximado (a vista de perto da tela Volta, que
; usa a pista_detalhada.png; a roda do mouse sobre a janela muda o zoom) e o replay da
; curva (pedido 36: a curva citada pelo radio, com a sua linha e a da referencia; pedido 43:
; os numeros da voz, a faixa do pedal, a diferenca acumulada, a velocidade e, nos boxes,
; a grade da sessao).

[ABOUT]
NAME = Rádio do engenheiro
AUTHOR = Sistema de Telemetria e Otimização de Trajetórias
VERSION = 0.4.2
DESCRIPTION = O rádio do coach no jogo (o cartão e a voz, nas retas e na linha de chegada), o minimapa, o mapa aproximado e o replay da curva, com o fantasma.

[CORE]
LAZY = NONE

[WINDOW_...]
ID = radio
NAME = Rádio · Sistema de Telemetria e Otimização de Trajetórias
FUNCTION_MAIN = janela
SIZE = 600, 220
FLAGS = NO_TITLE_BAR, NO_BACKGROUND, NO_SCROLLBAR, NO_COLLAPSE, FIXED_SIZE

[WINDOW_...]
ID = minimapa
NAME = Minimapa · Sistema de Telemetria e Otimização de Trajetórias
FUNCTION_MAIN = minimapa
SIZE = 300, 300
MIN_SIZE = 200, 200
MAX_SIZE = 640, 640
FLAGS = NO_TITLE_BAR, NO_BACKGROUND, NO_SCROLLBAR, NO_COLLAPSE

[WINDOW_...]
ID = aproximado
NAME = Mapa aproximado · Sistema de Telemetria e Otimização de Trajetórias
FUNCTION_MAIN = aproximado
SIZE = 360, 360
MIN_SIZE = 220, 220
MAX_SIZE = 900, 900
FLAGS = NO_TITLE_BAR, NO_BACKGROUND, NO_SCROLLBAR, NO_COLLAPSE, NO_SCROLL_WITH_MOUSE

[WINDOW_...]
ID = replay
NAME = Replay da curva · Sistema de Telemetria e Otimização de Trajetórias
